[project]
name = "ai-ecommerce-os"
version = "0.1.0"
description = "AI Ecommerce OS - modular ecommerce automation system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "integrations*"]
exclude = ["data*", "docs*", "tests*", "workflows*", "scripts*"]